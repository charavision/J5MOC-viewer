<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>J5MOC Viewer</title>

<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
</script>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #d9d9d9;
}

model-viewer {
    width: 100vw;
    height: 100vh;
}

.instructions-button {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);

    padding: 12px 28px;

    background: rgba(255,255,255,0.20);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    border: 1px solid rgba(255,255,255,0.40);
    border-radius: 999px;

    color: #ffffff;
    text-decoration: none;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 16px;
    font-weight: 600;

    transition: all 0.2s ease;
    z-index: 1000;
}

.instructions-button:hover {
    background: rgba(255,255,255,0.35);
    transform: translateX(-50%) scale(1.05);
}
.ao-toggle {
    position: fixed; top: 16px; right: 16px; z-index: 1000;
    padding: 10px 16px; border: 1px solid #999; border-radius: 999px;
    background: rgba(255,255,255,.85); color: #333; cursor: pointer;
    font: 600 14px Arial, sans-serif;
}
</style>
</head>

<body>

<model-viewer
    src="J5MOC-AO.glb"
    alt="LEGO Modell"
    camera-controls
    auto-rotate
    auto-rotate-delay="0"
    camera-orbit="0deg 75deg auto"
    shadow-intensity="1.25"
    shadow-softness="0.75"
    exposure="1.05"
    environment-image="neutral">
</model-viewer>

<a
    class="instructions-button"
    href="https://reb.li/m/209065"
    target="_blank"
    rel="noopener noreferrer">
    Instructions
</a>

<button class="ao-toggle" type="button" aria-pressed="true">AO: Ein</button>
<script type="module">
const viewer = document.querySelector('model-viewer');
function refinePlastic() {
    if (!viewer.model) return;
    let refined = 0;
    for (const material of viewer.model.materials) {
        const pbr = material.pbrMetallicRoughness;
        // Preserve transparent pieces and intentionally metallic surfaces.
        if (material.getAlphaMode() !== 'OPAQUE' ||
            pbr.baseColorFactor[3] < 1 || pbr.metallicFactor >= 0.5) continue;
        pbr.setMetallicFactor(0);
        pbr.setRoughnessFactor(0.28);
        refined++;
    }
    viewer.dataset.refinedMaterials = String(refined);
}
const toggle = document.querySelector('.ao-toggle');
toggle.addEventListener('click', () => {
    const enabled = toggle.getAttribute('aria-pressed') !== 'true';
    toggle.setAttribute('aria-pressed', String(enabled));
    toggle.textContent = enabled ? 'AO: Ein' : 'AO: Aus';
    delete viewer.dataset.refinedMaterials;
    viewer.src = enabled ? 'J5MOC-AO.glb' : 'Untitled.glb';
});
viewer.addEventListener('load', refinePlastic);
await customElements.whenDefined('model-viewer');
if (viewer.loaded) refinePlastic();
</script>

</body>
</html>
